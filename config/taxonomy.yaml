# --- Multi-source queries (fetch_other_sources.py) ---
other_sources_queries:
  - source: crossref
    query: "EU AI Act"
    category: eu-ai-act
  - source: crossref
    query: "AI governance"
    category: policy-analysis
  - source: dblp
    query: "AI literacy"
    category: literacy-frameworks
  - source: crossref
    query: "ISO 42001 AI"
    category: iso-42001

